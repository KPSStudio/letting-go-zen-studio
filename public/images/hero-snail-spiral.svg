<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-hidden="true">
  <title>Snail shell spiral</title>
  <!--
    Original line art: a snail-shell spiral, replacing the Fibonacci golden
    spiral that used to sit in this slot.

    GEOMETRY. This is a logarithmic (equiangular) spiral, r = a * e^(b * theta),
    which is the curve a real snail shell actually grows along - each turn is a
    fixed ratio larger than the last, so the shell keeps its shape as it grows.
    Sampled every 30 degrees over four and a half turns and joined with a smooth
    cubic path, which is why the curve accelerates outward rather than stepping
    up in jumps the way an arc construction does.

    Unlike the Fibonacci version this is ONE continuous path, so there are no
    arc junctions to form cusps, and a single stroke-dashoffset animation could
    draw it end to end if that is ever wanted.

    Square 200x200 viewBox: a shell reads as round, where the golden rectangle
    it replaced was 3:2. The CSS sizing was squared off to match.

    Palette matches the site's gold tokens: #8A4B2A, #B8942A, #F0D080, #D4AF6A.
    (Written as plain hex on purpose: the CSS custom-property names contain a
    double hyphen, which is illegal inside an XML comment and silently makes
    the whole file fail to parse as an image.)
  -->
  <defs>
    <linearGradient id="snail-stroke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A4B2A" />
      <stop offset="28%" stop-color="#B8942A" />
      <stop offset="62%" stop-color="#F0D080" />
      <stop offset="100%" stop-color="#D4AF6A" />
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#snail-stroke)" stroke-linecap="round" stroke-linejoin="round">
    <!-- The shell coil, winding outward from the centre. -->
    <path
      stroke-width="3.4"
      d="M 100 100
         C 100.6 99.4 101.6 99.6 102.1 100.4
         C 103.1 102.0 102.3 104.2 100.5 104.9
         C 97.6 106.1 94.4 104.4 93.5 101.4
         C 92.2 96.9 95.0 92.3 99.5 91.3
         C 105.9 89.8 112.2 94.0 113.4 100.4
         C 115.0 109.0 109.2 117.1 100.6 118.4
         C 89.4 120.1 79.3 112.2 77.8 101.0
         C 75.9 86.9 85.9 74.4 100.0 72.7
         C 117.5 70.6 133.0 83.0 135.0 100.5
         C 137.4 121.4 122.5 140.0 101.6 142.2
         C 76.9 144.8 55.1 126.9 52.6 102.2
         C 49.7 73.4 70.6 48.1 99.4 45.5
         C 132.4 42.5 161.2 66.4 164.0 99.4"
    />

    <!-- The opening lip that used to sit here has been removed: at ornament
         size it read as a detached tick rather than the mouth of a shell. The
         coil alone carries the form. -->
  </g>
</svg>
