<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-hidden="true">
  <title>Quantum orbital motif</title>
  <!--
    Original decorative atom / orbital motif: a nucleus, three elliptical
    orbital paths at 0 / 60 / 120 degrees, and three orbiting points, wrapped
    in a soft aura ring. Purely ornamental — deliberately no medical cross,
    no device, no reading, no label, so the graphic cannot be read as a
    diagnostic or efficacy claim.

    Palette matches the site's gold tokens: #B8942A, #D4AF6A, #F0D080.
    (Written as plain hex on purpose: the CSS custom-property names contain a
    double hyphen, which is illegal inside an XML comment and silently makes
    the whole file fail to parse as an image.)
  -->
  <defs>
    <linearGradient id="q-orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8A4B2A" />
      <stop offset="30%" stop-color="#B8942A" />
      <stop offset="65%" stop-color="#F0D080" />
      <stop offset="100%" stop-color="#D4AF6A" />
    </linearGradient>
    <radialGradient id="q-nucleus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0D080" />
      <stop offset="60%" stop-color="#D4AF6A" />
      <stop offset="100%" stop-color="#B8942A" />
    </radialGradient>
    <radialGradient id="q-aura" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#F0D080" stop-opacity="0" />
      <stop offset="88%" stop-color="#D4AF6A" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#B8942A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Soft energy aura behind everything. -->
  <circle cx="100" cy="100" r="96" fill="url(#q-aura)" />

  <g fill="none" stroke-linecap="round">

    <!-- Outer containing ring, kept faint. -->
    <circle cx="100" cy="100" r="90" stroke="#D4AF6A" stroke-opacity="0.28" stroke-width="1" />
    <circle cx="100" cy="100" r="84" stroke="#B8942A" stroke-opacity="0.16" stroke-width="0.6"
            stroke-dasharray="2 7" />

    <!-- Three orbital shells. Each group carries its own orbiting point so the
         point always sits exactly on its ellipse. -->
    <g transform="rotate(0 100 100)">
      <ellipse cx="100" cy="100" rx="78" ry="30" stroke="url(#q-orbit)" stroke-width="1.7" />
      <circle cx="178" cy="100" r="5.5" fill="#F0D080" stroke="none" />
    </g>

    <g transform="rotate(60 100 100)">
      <ellipse cx="100" cy="100" rx="78" ry="30" stroke="url(#q-orbit)" stroke-width="1.7" />
      <circle cx="22" cy="100" r="4.6" fill="#D4AF6A" stroke="none" />
    </g>

    <g transform="rotate(120 100 100)">
      <ellipse cx="100" cy="100" rx="78" ry="30" stroke="url(#q-orbit)" stroke-width="1.7" />
      <circle cx="40.25" cy="119.28" r="4" fill="#B8942A" stroke="none" />
    </g>
  </g>

  <!-- Nucleus. -->
  <circle cx="100" cy="100" r="15" fill="url(#q-nucleus)" />
  <circle cx="100" cy="100" r="21" fill="none" stroke="#F0D080" stroke-opacity="0.45" stroke-width="0.9" />
</svg>
