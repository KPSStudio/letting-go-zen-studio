<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img" aria-hidden="true">
  <title>Golden ratio spiral</title>
  <!--
    Original line art: the golden spiral, drawn as eight quarter arcs whose
    radii follow the Fibonacci sequence (21, 13, 8, 5, 3, 2, 1, 1).

    The construction scaffolding this was originally drawn over (the eight
    Fibonacci squares and the outer golden rectangle) has been removed at the
    client's request, so only the curve itself remains.

    GEOMETRY, and why it is easy to get wrong: each arc is centred on the
    corner of its square nearest the point the spiral accumulates around, and
    every arc sweeps the same way (all sweep flags are 1). Tangent continuity
    alone is NOT enough. If consecutive arcs meet tangentially but their
    centres sit on OPPOSITE sides of the curve, the curvature flips sign and
    the join becomes a cusp, so the figure reads as a pointed star instead of
    a spiral. The centres below are chosen so the radius vector at each
    junction points the same way on both sides of the join, which is what
    makes this wind continuously inward.

    The curve spans exactly the 34x21 box the outer rectangle used to trace,
    so removing the scaffolding did not move it and no viewBox change was
    needed.

    Drawn in 34x21 units and scaled into the 240x160 viewBox, so the stroke
    width below is in the small unit space (0.42 unit is about 2.7px here).
    Palette matches the site's gold tokens: #B8942A, #D4AF6A, #F0D080.
    (Written as plain hex on purpose: the CSS custom-property names contain a
    double hyphen, which is illegal inside an XML comment and silently makes
    the whole file fail to parse as an image.)
  -->
  <defs>
    <linearGradient id="fib-stroke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A4B2A" />
      <stop offset="28%" stop-color="#B8942A" />
      <stop offset="62%" stop-color="#F0D080" />
      <stop offset="100%" stop-color="#D4AF6A" />
    </linearGradient>
  </defs>

  <g transform="translate(11 13) scale(6.4)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arc centres, in order: (21,21) (21,13) (26,13) (26,16) (24,16)
         (24,15) (25,15) (25,15). All sweep flags are 1 - see the note above. -->
    <path
      d="M 0 21
         A 21 21 0 0 1 21 0
         A 13 13 0 0 1 34 13
         A 8 8 0 0 1 26 21
         A 5 5 0 0 1 21 16
         A 3 3 0 0 1 24 13
         A 2 2 0 0 1 26 15
         A 1 1 0 0 1 25 16
         A 1 1 0 0 1 24 15"
      stroke="url(#fib-stroke)"
      stroke-width="0.42"
    />
  </g>
</svg>
